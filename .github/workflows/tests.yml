name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[api-games]'
      - run: python -m nltk.downloader -d runs/nltk_api_v1 words averaged_perceptron_tagger_eng
      - run: python -m unittest discover -s tests -v
