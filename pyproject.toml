[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-memory-and-safety"
version = "0.1.0"
description = "Controlled experiments on agent execution-state representations and safety"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
whitebox = ["torch>=2.2", "transformers>=4.51,<5", "accelerate>=0.30", "numpy>=1.26"]
analysis = ["numpy>=1.26", "scikit-learn>=1.4"]

[project.scripts]
ams = "agent_memory_safety.cli:main"

[tool.setuptools.packages.find]
include = ["agent_memory_safety*"]
