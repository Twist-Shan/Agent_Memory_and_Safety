[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-memory-and-safety"
version = "0.1.0"
description = "Controlled experiments on agent execution-state representations and safety"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
whitebox = ["torch>=2.2", "transformers>=4.51,<5", "accelerate>=0.30", "numpy>=1.26"]
analysis = ["numpy>=1.26", "scikit-learn>=1.4"]
agentic = ["loguru==0.7.3"]
api-games = ["loguru==0.7.3", "nltk==3.9.2"]
muse = ["loguru==0.7.3", "torch==2.11.0", "torchvision==0.26.0", "transformers==5.19.0", "accelerate>=0.30", "numpy>=1.26"]

[project.scripts]
ams = "agent_memory_safety.cli:main"
ams-agentic = "agent_memory_safety.agentic.cli:main"

[tool.setuptools.packages.find]
include = ["agent_memory_safety*"]
exclude = ["agent_memory_safety.agentic._vendor*"]

[tool.setuptools.package-data]
"agent_memory_safety.agentic" = ["_vendor/**/*"]
